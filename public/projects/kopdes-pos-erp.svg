<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKopdes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f150c" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#bgKopdes)" rx="12"/>
  <g stroke="#412d15" stroke-width="1" opacity="0.4">
    <line x1="0" y1="95" x2="600" y2="95" />
    <line x1="0" y1="190" x2="600" y2="190" />
    <line x1="0" y1="285" x2="600" y2="285" />
    <line x1="150" y1="0" x2="150" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="450" y1="0" x2="450" y2="380" />
  </g>
  <rect x="40" y="35" width="520" height="310" rx="8" fill="#1f150c" stroke="#412d15" stroke-width="1.5" />
  <rect x="40" y="35" width="520" height="36" rx="8" fill="#412d15" opacity="0.6"/>
  <circle cx="65" cy="53" r="5" fill="#e1dcc9" opacity="0.8"/>
  <circle cx="82" cy="53" r="5" fill="#e1dcc9" opacity="0.4"/>
  <circle cx="99" cy="53" r="5" fill="#e1dcc9" opacity="0.2"/>
  <text x="125" y="57" fill="#e1dcc9" font-family="monospace" font-size="11" letter-spacing="1">KOPDES // POS &amp; ERP REAL-TIME ENGINE</text>
  
  <!-- Left Side: POS Cashier Terminal -->
  <rect x="65" y="90" width="220" height="230" rx="6" fill="#000000" stroke="#412d15" />
  <text x="80" y="118" fill="#e1dcc9" font-family="monospace" font-size="11" font-weight="bold">POINT OF SALE (POS)</text>
  <rect x="80" y="132" width="190" height="38" rx="4" fill="#412d15" opacity="0.5"/>
  <text x="92" y="148" fill="#b8af9b" font-family="monospace" font-size="9">TRANSAKSI KASIR</text>
  <text x="92" y="162" fill="#e1dcc9" font-family="monospace" font-size="11" font-weight="bold">Rp 2.450.000 / Realtime</text>
  
  <rect x="80" y="180" width="190" height="30" rx="4" fill="#1f150c" stroke="#412d15"/>
  <text x="92" y="199" fill="#b8af9b" font-family="sans-serif" font-size="10">Scan Barcode / Auto-Stock</text>
  
  <rect x="80" y="220" width="190" height="30" rx="4" fill="#1f150c" stroke="#412d15"/>
  <text x="92" y="239" fill="#b8af9b" font-family="sans-serif" font-size="10">Sync ke Backend Express.js</text>

  <rect x="80" y="260" width="190" height="42" rx="4" fill="#412d15" opacity="0.3"/>
  <text x="92" y="278" fill="#e1dcc9" font-family="monospace" font-size="9">DATABASE OPTIMIZATION</text>
  <text x="92" y="292" fill="#b8af9b" font-family="monospace" font-size="9">&lt; 15ms Latency Indexing</text>

  <!-- Right Side: ERP Modules -->
  <rect x="305" y="90" width="230" height="230" rx="6" fill="#000000" stroke="#412d15" />
  <text x="320" y="118" fill="#e1dcc9" font-family="monospace" font-size="11" font-weight="bold">ERP CORE MODULES</text>
  
  <!-- Module 1: Inventory -->
  <rect x="320" y="132" width="200" height="48" rx="4" fill="#1f150c" stroke="#412d15"/>
  <text x="335" y="152" fill="#e1dcc9" font-family="sans-serif" font-size="11" font-weight="bold">1. Manajemen Stok Barang</text>
  <text x="335" y="168" fill="#b8af9b" font-family="sans-serif" font-size="9">Otomatisasi kartu stok &amp; restock alert</text>

  <!-- Module 2: Finance -->
  <rect x="320" y="190" width="200" height="48" rx="4" fill="#1f150c" stroke="#412d15"/>
  <text x="335" y="210" fill="#e1dcc9" font-family="sans-serif" font-size="11" font-weight="bold">2. Keuangan &amp; Kas Koperasi</text>
  <text x="335" y="226" fill="#b8af9b" font-family="sans-serif" font-size="9">Laba rugi, neraca, &amp; arus kas terintegrasi</text>

  <!-- Module 3: Reporting -->
  <rect x="320" y="248" width="200" height="54" rx="4" fill="#412d15" opacity="0.6"/>
  <text x="335" y="268" fill="#e1dcc9" font-family="sans-serif" font-size="11" font-weight="bold">3. Laporan Eksekutif</text>
  <text x="335" y="284" fill="#b8af9b" font-family="sans-serif" font-size="9">Export PDF &amp; Visual Analytics Real-time</text>
